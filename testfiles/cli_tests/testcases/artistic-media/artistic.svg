<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="200mm" height="100mm" viewBox="0 0 200 100">
  <!-- INVARIANT GEOMETRY (1 user unit = 1 mm):
       s1: open line (20,30)-(120,30), stroke #000000 width 1, fill none
       s3: closed square (40,60)-(80,60)-(80,90)-(40,90), stroke #0000ff width 1, fill none
       r1: rect 150,60 30x20, fill #ff0000 -->
  <g id="L1" inkscape:groupmode="layer" inkscape:label="Layer 1">
    <path id="s1" d="M 20,30 L 120,30" fill="none" stroke="#000000" stroke-width="1" />
    <path id="s3" d="M 40,60 L 80,60 L 80,90 L 40,90 Z" fill="none" stroke="#0000ff" stroke-width="1" />
    <rect id="r1" x="150" y="60" width="30" height="20" fill="#ff0000" />
  </g>
</svg>
