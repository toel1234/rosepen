<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="200mm" height="100mm" viewBox="0 0 200 100">
  <!-- INVARIANT GEOMETRY (1 user unit = 1 mm), pre-authored artistic objects:
       a1: skeleton (20,30)-(120,30), effect a1-artistic preset taper-end width 10, NO shape_d
           (load-time repair from the library); d is the outline a real save would carry
       a2: skeleton (20,70)-(120,70), effect a2-artistic preset no-such-shape width 6, NO shape_d
           (unknown name: renders Uniform and writes nothing) -->
  <defs>
    <inkscape:path-effect id="a1-artistic" effect="artistic_media" is_visible="true" lpeversion="1"
                          mode="preset" shape="taper-end" width="10" angle="30" scale_with_object="true" />
    <inkscape:path-effect id="a2-artistic" effect="artistic_media" is_visible="true" lpeversion="1"
                          mode="preset" shape="no-such-shape" width="6" angle="30" scale_with_object="true" />
  </defs>
  <g id="L1" inkscape:groupmode="layer" inkscape:label="Layer 1">
    <path id="a1" d="M 20,25 L 120,30 L 20,35 Z"
          inkscape:original-d="M 20,30 L 120,30"
          inkscape:path-effect="#a1-artistic"
          style="fill:#000000;stroke:none;fill-rule:nonzero" />
    <path id="a2" d="M 20,67 L 120,67 L 120,73 L 20,73 Z"
          inkscape:original-d="M 20,70 L 120,70"
          inkscape:path-effect="#a2-artistic"
          style="fill:#000000;stroke:none;fill-rule:nonzero" />
  </g>
</svg>
