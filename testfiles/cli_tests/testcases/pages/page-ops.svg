<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Invariants of this fixture (03-01 task 2, do not casually change):

  * Millimetre document: width/height 100mm over viewBox "0 0 100 100", i.e.
    1 user unit = 1 mm; page sizes in user units equal millimetres.
  * Page 1 "Front" (p1) is the viewport page: its document-rect corner equals
    the root viewBox origin.  Page 2 "Back" (p2) is A5 LANDSCAPE (210x148 at
    x=110) so the layout mixes page sizes from the start.
  * rect1 sits on Front, rect2 sits on Back; no transforms anywhere.
  * The expectations in page-ops.expect.json are spec-derived from
    .paul/phases/03-multipage-pdfx/03-01-PLAN.md (task 2) and the upstream
    page model; contradicting observed output is a finding, never a reason
    to loosen the checker.
-->
<svg
   width="100mm"
   height="100mm"
   viewBox="0 0 100 100"
   version="1.1"
   id="page-ops"
   inkscape:docname="page-ops.svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd">
  <sodipodi:namedview
     id="namedview1"
     inkscape:document-units="mm"
     showgrid="false" />
  <defs
     id="defs1">
    <view
       id="p1"
       viewBox="0 0 100 100"
       inkscape:label="Front" />
    <view
       id="p2"
       viewBox="110 0 210 148"
       inkscape:label="Back"
       inkscape:page-size="A5" />
  </defs>
  <rect
     id="rect1"
     x="10"
     y="10"
     width="40"
     height="30"
     fill="#ff0000" />
  <rect
     id="rect2"
     x="130"
     y="20"
     width="50"
     height="40"
     fill="#0000ff" />
</svg>
