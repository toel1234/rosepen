<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="200mm" height="100mm" viewBox="0 0 200 100">
  <!-- INVARIANT GEOMETRY (1 user unit = 1 mm):
       r1: rect 10,20 40x60 (bbox right edge x=50, bottom y=80)
       r2: rect 100,30 50x40 (bbox left x=100, top y=30, bottom y=70)
       p1: open polyline (20,90) (60,90) (60,50)
       p2: right angle path (150,20) (180,20) (180,50) -->
  <rect id="r1" x="10" y="20" width="40" height="60" fill="#55ddff" />
  <rect id="r2" x="100" y="30" width="50" height="40" fill="#ffdd55" />
  <path id="p1" d="M 20,90 L 60,90 L 60,50" fill="none" stroke="#000000" />
  <path id="p2" d="M 150,20 L 180,20 L 180,50" fill="none" stroke="#000000" />
</svg>
