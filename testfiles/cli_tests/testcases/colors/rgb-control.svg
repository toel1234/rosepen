<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- invariant: an RGB-only document gains no icc, cmyk or separation representation in the round trip -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" width="100mm" height="80mm" viewBox="0 0 100 80" version="1.1" id="svg1">
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#666666" inkscape:document-units="mm" />
  <defs id="defs1">
    <linearGradient id="grad-rgb" x1="0" y1="0" x2="1" y2="0">
      <stop id="stop1" offset="0" style="stop-color:#3366cc" />
      <stop id="stop2" offset="1" stop-color="#cc3366" />
    </linearGradient>
  </defs>
  <rect id="fill-rgb" x="5" y="5" width="30" height="20" style="fill:#3366cc" />
  <rect id="stroke-rgb" x="5" y="30" width="30" height="20" style="fill:none;stroke:#cc3366;stroke-width:2" />
  <rect id="fill-rgb-gradient" x="45" y="5" width="50" height="45" style="fill:url(#grad-rgb)" />
</svg>
