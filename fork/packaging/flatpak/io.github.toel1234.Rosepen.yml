# SPDX-License-Identifier: GPL-2.0-or-later
#
# SKELETON — not yet built; the first real build is a later plan.
# flatpak-builder is intentionally absent from the development machine, so this
# manifest is statically validated only (see fork/packaging/lint-packaging.py).
#
# Runtime-version source: `git ls-remote --heads
# https://gitlab.gnome.org/GNOME/gnome-build-meta 'gnome-*'` at execution time
# reported gnome-47 .. gnome-51; the highest release branch is gnome-51, so the
# current stable GNOME runtime is org.gnome.Platform//51.
#
# Modules are ordered as dependencies. The module list is adapted from the
# Flathub org.inkscape.Inkscape manifest, moved from the GTK3 to the GTK4 stack.
# Providing gtkmm/cairo in /app makes CMake skip the ExternalProject downloads,
# because Flatpak builds have no network access.
#
# ImageMagick is intentionally not bundled: -DWITH_IMAGE_MAGICK=OFF keeps this
# skeleton small. A later plan can add the ImageMagick module.
#
# All archive sha256 values were computed at execution time by downloading each
# tarball. No placeholder hashes.

id: io.github.toel1234.Rosepen
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: rosepen

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - "*.a"

modules:
  - name: cairo
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
      - -Dgtk_doc=false
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairo-1.18.6.tar.xz
        sha256: 1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4

  - name: libsigc++-3
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc%2B%2B/3.6/libsigc%2B%2B-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17

  - name: glibmm-2.68
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.84/glibmm-2.84.0.tar.xz
        sha256: 56ee5f51c8acfc0afdf46959316e4c8554cb50ed2b6bc5ce389d979cbb642509

  - name: cairomm-1.16
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.16.2.tar.xz
        sha256: 6a63bf98a97dda2b0f55e34d1b5f3fb909ef8b70f9b8d382cb1ff3978e7dc13f

  - name: pangomm-2.48
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.56/pangomm-2.56.2.tar.xz
        sha256: f1e984c85a85b6a0e61616366521f51dd8282a072bb45d15b5084762b62f4c0e

  - name: gtkmm-4.0
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-demos=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/4.20/gtkmm-4.20.0.tar.xz
        sha256: daad9bf9b70f90975f91781fc7a656c923a91374261f576c883cd3aebd59c833

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --with-libraries=filesystem,stacktrace
      - ./b2 install variant=release link=shared runtime-link=shared --prefix=/app -j $FLATPAK_BUILDER_N_JOBS
    cleanup:
      - /include
      - /lib/libboost_*.so
      - /lib/libboost_*.a
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
        sha256: 1bed88e40401b2cb7a1f76d4bab499e352fa4d0c5f31c0dbae64e24d34d7513b

  - name: double-conversion
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/google/double-conversion/archive/refs/tags/v3.3.1.tar.gz
        sha256: fe54901055c71302dcdc5c3ccbe265a6c191978f3761ce1414d0895d6b0ea90e
        dest-filename: double-conversion-3.3.1.tar.gz

  - name: gsl
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz
        sha256: 6a99eeed15632c6354895b1dd542ed5a855c0f15d9ad1326c6fe2b2c9e423190

  - name: bdwgc
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
    modules:
      - name: libatomic_ops
        buildsystem: autotools
        config-opts:
          - --enable-shared
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/bdwgc/libatomic_ops/releases/download/v7.6.12/libatomic_ops-7.6.12.tar.gz
            sha256: f0ab566e25fce08b560e1feab6a3db01db4a38e5bc687804334ef3920c549f3e
    sources:
      - type: archive
        url: https://github.com/ivmai/bdwgc/releases/download/v8.2.8/gc-8.2.8.tar.gz
        sha256: 7649020621cb26325e1fb5c8742590d92fb48ce5c259b502faf7d9fb5dabb160

  - name: potrace
    buildsystem: autotools
    config-opts:
      - --with-libpotrace
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/potrace/1.16/potrace-1.16.tar.gz
        sha256: be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc

  - name: librevenge
    buildsystem: autotools
    config-opts:
      - --disable-tests
      - --disable-werror
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/libwpd/librevenge/librevenge-0.0.5/librevenge-0.0.5.tar.xz
        sha256: 106d0c44bb6408b1348b9e0465666fa83b816177665a22cd017e886c1aaeeb34

  - name: libwpd
    buildsystem: autotools
    config-opts:
      - --disable-tests
      - --disable-werror
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/libwpd/libwpd/libwpd-0.10.3/libwpd-0.10.3.tar.xz
        sha256: 2465b0b662fdc5d4e3bebcdc9a79027713fb629ca2bff04a3c9251fdec42dd09

  - name: libwpg
    buildsystem: autotools
    config-opts:
      - --disable-tests
      - --disable-werror
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/libwpg/libwpg/libwpg-0.3.4/libwpg-0.3.4.tar.xz
        sha256: b55fda9440d1e070630eb2487d8b8697cf412c214a27caee9df69cec7c004de3

  - name: libvisio
    buildsystem: autotools
    config-opts:
      - --disable-tests
      - --disable-static
    sources:
      - type: archive
        url: https://dev-www.libreoffice.org/src/libvisio/libvisio-0.1.8.tar.xz
        sha256: b4098ffbf4dcb9e71213fa0acddbd928f27bed30db2d80234813b15d53d0405b

  - name: libcdr
    buildsystem: autotools
    config-opts:
      - --disable-tests
      - --disable-static
    sources:
      - type: archive
        url: https://dev-www.libreoffice.org/src/libcdr/libcdr-0.1.8.tar.xz
        sha256: ced677c8300b29c91d3004bb1dddf0b99761bf5544991c26c2ee8f427e87193c
      - type: shell
        commands:
          - autoreconf -vfi

  - name: poppler-data
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_GLIB=ON
      - -DENABLE_CPP=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_UNSTABLE_API_ABI_HEADERS=ON
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-25.09.0.tar.xz
        sha256: 758abfe0c77108c72d654b291dfbce54964b5315a53028e3875f07ef55ff20a3

  - name: rosepen
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_IMAGE_MAGICK=OFF
    sources:
      # The working tree root, three levels above this manifest.
      - type: dir
        path: ../../..
        skip:
          - build
          - install
          - .git
          - .ccache
      # Release builds will replace the dir source above with:
      # - type: git
      #   url: https://github.com/toel1234/rosepen.git
      #   tag: <release tag>
      #   commit: <40-hex commit>
