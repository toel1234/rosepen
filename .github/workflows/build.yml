# SPDX-License-Identifier: GPL-2.0-or-later
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      BUILD_TYPE: Release
      SKIP_APT_FILE: "1"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch fork-base
        run: git fetch --no-tags --depth=1 origin +refs/tags/fork-base:refs/tags/fork-base

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: fork/scripts/install-build-deps-ubuntu.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust
          key: cargo-${{ runner.os }}-${{ hashFiles('src/rust/tracecdr-ffi/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: |
          fork/scripts/build-local.sh
          ccache -s

      - name: Verify branding
        run: fork/scripts/verify-branding.sh

      - name: Build AppImage
        run: fork/packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Rosepen-x86_64-${{ github.sha }}
          path: build/appimage/Rosepen-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Build tests
        run: ninja -C build -j"$(nproc)" tests

      # Fork-owned suites only: every Rosepen CLI corpus carries a ctest label,
      # plus all gtest/Rust unit tests. Serial on purpose (CLI tests race the
      # session D-Bus app id). test_style and test_lpe fail on the upstream
      # fork base and stay excluded until fixed upstream.
      - name: Test
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          cd build
          xvfb-run -a ctest --output-on-failure --timeout 600 \
            -E '^test_(style|lpe)$' -R '^(test_|rust_)'
          xvfb-run -a ctest --output-on-failure --timeout 600 \
            -L 'artistic-media|cdr-bridge|cdr-import|color-corpus|dimension|docker|live-sketch|master-layer|page-ops|pdfx|powerclip|smart-fill|toolbox|tracecdr|workspace'
