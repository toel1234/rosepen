#
# Rosepen toolbox groups (Corel-style flyout toolbox).
#
# [toolbox] order lists the group ids top to bottom. Each [group:<id>] section
# lists its tools with a semicolon-separated `tools` key; the first member is
# the default face and the last-used member is remembered per group in the
# /toolbox/flyouts/<id>/active preference. `not-in-toolbox` names tools that
# stay out of the toolbox entirely (same set as upstream Inkscape). Every tool
# known to get_tool_data() must appear in exactly one group or in
# not-in-toolbox; the grouped tools must match share/ui/toolbar-tool.ui.

[toolbox]
order=pick;shape;crop;zoom;curve;artistic-media;rectangle;ellipse;object;text;dimension;effects;eyedropper;fill
not-in-toolbox=Marker;Picker

[group:pick]
tools=Select

[group:shape]
tools=Node;Tweak;Booleans

[group:crop]
tools=Eraser

[group:zoom]
tools=Zoom;Pages

[group:curve]
tools=Pencil;Pen

[group:artistic-media]
tools=Calligraphic;Spray

[group:rectangle]
tools=Rect

[group:ellipse]
tools=Arc

[group:object]
tools=Star;Spiral;3DBox

[group:text]
tools=Text

[group:dimension]
tools=Measure;Connector

[group:effects]
tools=LPETool

[group:eyedropper]
tools=Dropper

[group:fill]
tools=Gradient;Mesh;PaintBucket
